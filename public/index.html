<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小骨宝 OsteoPal · 骨癌工作台原型 v0.2.1</title>
<!-- 内联 favicon：原型是 file:// 或单目录静态托管，不给 favicon.ico 会在控制台留一条 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c07a3e'/%3E%3Ctext x='16' y='23' font-size='19' font-family='PingFang SC,Helvetica,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E9%AA%A8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="primer.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span><b>交互原型 v0.2.1</b> · 全部为模拟资料（临床试验列表为真实登记摘录，状态未核实）</span><span>仅本页演示 · 刷新重置 · 未接入 DSH / AI</span></div>
<div class="workspace">
  <aside class="sidebar" aria-label="小骨宝业务导航">
    <div class="brand no-mark"><div><strong>小骨宝</strong><span>OsteoPal · 影像先记全</span></div></div>
    <button class="profile profile-btn" id="profile-btn" data-action="profiles" aria-label="切换演示档案，当前为林远">
      <div class="avatar" id="profile-avatar" aria-hidden="true">林</div>
      <div><b id="profile-name">林远的资料</b><span id="profile-meta">19 岁 · 骨肉瘤（左股骨远端）</span></div>
      <span class="profile-caret" aria-hidden="true">⌄</span>
    </button>
    <nav id="nav" aria-label="一级导航"></nav>
    <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>影像记全，<br>功能恢复看得见。</p><button class="text-button" data-action="help">原型操作说明 ↗</button></div>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小骨宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <button class="status" id="ready-store" data-action="open-store" aria-label="资料目录：已激活"><i></i><span>资料目录</span><b>已激活</b></button>
        <button class="status" id="agent-toggle" data-action="agent" aria-expanded="false" aria-label="AI 对话：点击打开右侧原生会话面板"><i class="grey"></i><span>AI 对话</span><b id="agent-state">未进入激活</b></button>
        <button data-action="settings" aria-label="打开设置：工作区目录、文档解析、临床数据库">设置</button>
        <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
        <button class="dp-trigger" type="button" data-primer-open aria-haspopup="dialog" aria-controls="disease-primer" aria-expanded="false" aria-label="疾病概要：定义、医学资料与指南情况、治疗全景、发展趋势" title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
        <button class="ver-chip" id="ver-chip" data-action="about" aria-label="关于小骨宝：查看版本号与构建信息">v0.2.1</button>
      </div>
    </header>
    <div class="work-grid" id="work-grid">
      <main id="main" tabindex="-1"></main>
      <aside class="agent-dock" id="agent-dock" aria-label="AI 原生会话面板" hidden>
        <div class="agent-head">
          <span class="dot" id="agent-dot"></span><b>AI 对话</b>
          <div class="spacer"></div>
          <div class="agent-sizes" role="group" aria-label="面板宽度">
            <button data-action="agent-size" data-size="narrow" aria-pressed="false" title="窄">窄</button>
            <button data-action="agent-size" data-size="std" aria-pressed="true" title="标准">标准</button>
            <button data-action="agent-size" data-size="wide" aria-pressed="false" title="宽">宽</button>
          </div>
          <button class="icon-button" data-action="agent" aria-label="隐藏 AI 对话面板" title="隐藏">×</button>
        </div>
        <div class="agent-body" id="agent-body"></div>
        <div class="agent-foot">
          <button class="primary" data-action="agent-build">整理本页要点</button>
          <button data-action="agent-demo">模拟回复自检</button>
        </div>
      </aside>
    </div>
    <footer class="footer">小骨宝 · 与骨癌患者和照护者一起整理、理解、准备沟通 <span class="ver-line"><b id="app-version">v0.2.1</b><em id="app-build">2026-10-21</em></span></footer>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小骨宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="pv-overlay" id="pv-overlay" hidden>
  <div class="pv-panel" id="pv-panel" role="dialog" aria-modal="true" aria-labelledby="pv-title" tabindex="-1">
    <div class="pv-head">
      <span class="pv-eyebrow">整页视图</span>
      <span class="pv-crumb-slot" aria-label="层级路径"></span>
      <b class="pv-title" id="pv-title"></b>
      <div class="pv-head-actions">
        <button data-pv-action="back" aria-label="返回上一层">返回</button>
        <button data-pv-action="close" aria-label="关闭整页视图">关闭</button>
      </div>
    </div>
    <div class="pv-body"></div>
  </div>
</div>
<script src="demo-data.js"></script>
<script src="primer-data.js"></script>
<script src="primer.js"></script>
<script src="app.js"></script>
</body></html>
